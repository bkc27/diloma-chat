<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Room</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <div>
          <h2>Diploma Group Chat</h2>
          <p class="current-user">You: <strong id="current-user-name"></strong></p>
          <p>Room <span id="room-name"></span></p>
        </div>
        <a href="/" class="leave-btn">Leave</a>
      </div>
      <p id="connection-status" role="status">Connecting...</p>
      <div class="chat-messages" id="chat-messages" role="log" aria-label="Chat messages" aria-live="polite"></div>
      <form id="chat-form">
        <input
          type="text"
          id="message"
          placeholder="Type Your Message..."
          autocomplete="off"
          maxlength="2000"
          aria-label="Message"
          required
        />
        <button type="submit" disabled>Send</button>
      </form>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
